<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>heeblings 서비스 개인정보처리방침</title>
    <!-- Tailwind CSS CDN 로드 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Inter 폰트 적용 (Tailwind 기본 폰트와 잘 어울림) */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100">

<!-- 페이지 컨테이너 -->
<div class="max-w-2xl mx-auto my-12 p-8 sm:p-12 bg-white shadow-lg rounded-lg">

    <!-- 헤더 -->
    <h1 class="text-3xl font-bold text-gray-900 mb-6 border-b pb-4">
        Heeblings 서비스 개인정보처리방침
    </h1>
    <p class="text-lg text-gray-600 mb-8">
        Heeblings에서 제공하는 애플리케이션 및 서비스의 개인정보처리방침입니다.
        <br>
        자세한 내용은 각 서비스의 링크를 클릭하여 확인해주세요.
    </p>

    <!-- 정책 링크 리스트 -->
    <ul class="space-y-6">

        <!-- 1. 내 화초 시들기 전에: 물주기 알림 -->
        <li class="flex flex-col sm:flex-row justify-between sm:items-center bg-gray-50 p-6 rounded-lg shadow-sm border border-gray-200">
            <div>
                <h2 class="text-xl font-semibold text-gray-800">내 화초 시들기 전에: 물주기 알림</h2>
                <p class="text-sm text-gray-500 mt-1">화초 관리 및 물주기 알림 서비스</p>
            </div>
            <a href="https://api.heeblings.kr/plant-app/privacy" target="_blank" class="mt-4 sm:mt-0 sm:ml-4 flex-shrink-0 bg-green-600 text-white font-bold py-2 px-4 rounded-md hover:bg-green-700 transition-colors">
                정책 보기
            </a>
        </li>

        <!-- 2. 루틴 관리: 퇴근 후 2시간 -->
        <li class="flex flex-col sm:flex-row justify-between sm:items-center bg-purple-50 p-6 rounded-lg shadow-sm border border-purple-200">
            <div>
                <h2 class="text-xl font-semibold text-gray-800">루틴 관리: 퇴근 후 2시간</h2>
                <p class="text-sm text-gray-500 mt-1">목표 달성을 위한 자기계발 루틴 관리 서비스</p>
            </div>
            <a href="https://api.heeblings.kr/routine-manager-app/privacy" target="_blank" class="mt-4 sm:mt-0 sm:ml-4 flex-shrink-0 bg-purple-600 text-white font-bold py-2 px-4 rounded-md hover:bg-purple-700 transition-colors">
                정책 보기
            </a>
        </li>

        <!-- 3. 등하원알리미 -->
        <li class="flex flex-col sm:flex-row justify-between sm:items-center bg-yellow-50 p-6 rounded-lg shadow-sm border border-yellow-200">
            <div>
                <h2 class="text-xl font-semibold text-gray-800">등하원알리미</h2>
                <p class="text-sm text-gray-500 mt-1">학부모를 위한 간편 알림 서비스</p>
            </div>
            <a href="https://api.heeblings.kr/parent-helper-app/privacy" target="_blank" class="mt-4 sm:mt-0 sm:ml-4 flex-shrink-0 bg-yellow-600 text-white font-bold py-2 px-4 rounded-md hover:bg-yellow-700 transition-colors">
                정책 보기
            </a>
        </li>
    </ul>

</div>
</body>
</html>
